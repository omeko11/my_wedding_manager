<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- 1. Left Vertical Pillar Gradient -->
    <linearGradient id="d-pillar-left" x1="28" y1="30" x2="28" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>

    <!-- 2. Left-to-Center Fold Gradient -->
    <linearGradient id="d-fold-left" x1="34" y1="34" x2="62" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3730A3" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <!-- 3. Right Vertical Pillar Gradient -->
    <linearGradient id="d-pillar-right" x1="84" y1="34" x2="84" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="45%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>

    <!-- 4. Center-to-Right Ascending Check Ribbon -->
    <linearGradient id="d-fold-right" x1="48" y1="78" x2="90" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="45%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- 5. 4-Point Celebration Sparkle Gradient -->
    <linearGradient id="d-sparkle" x1="82" y1="12" x2="106" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#FDA4AF" />
    </linearGradient>

    <filter id="d-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- ICON MARK (3D Origami Ribbon M + Sparkle) -->
  <g transform="translate(4, 2)" filter="url(#d-shadow)">
    <!-- Back Layer: Left-to-Center Diagonal Fold -->
    <path d="M28 32L63 73L51 81L22 44L28 32Z" fill="url(#d-fold-left)" />

    <!-- Right Vertical Pillar -->
    <rect x="74" y="32" width="18" height="60" rx="7" fill="url(#d-pillar-right)" />

    <!-- Left Vertical Pillar -->
    <rect x="20" y="32" width="18" height="60" rx="7" fill="url(#d-pillar-left)" />

    <!-- Front Hero Layer: Ascending Cyan Checkmark Ribbon -->
    <path d="M48.5 76.5L74.5 35.5C76.5 32.3 80 32 83.5 32H85C89.4 32 92 35.5 92 39.5C92 41.5 91.2 43.4 89.8 45.2L62.8 81.2C59.2 86 52 86 48.5 81.2C46.5 78.5 46.8 75.2 48.5 76.5Z" fill="url(#d-fold-right)" />

    <!-- 4-Point Sparkle -->
    <path d="M95 10C95 18.5 98.5 22 107 22C98.5 22 95 25.5 95 34C95 25.5 91.5 22 83 22C91.5 22 95 18.5 95 10Z" fill="url(#d-sparkle)" />
  </g>

  <!-- WORDMARK (Dark Mode: Crisp White "MEPlan" + "MY EVENT PLANNER") -->
  <text x="124" y="72" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" letter-spacing="-1">
    <tspan font-weight="800" fill="#FFFFFF">ME</tspan><tspan font-weight="600" fill="#FFFFFF">Plan</tspan>
  </text>

  <!-- Subtitle: MY EVENT PLANNER -->
  <text x="127" y="96" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="5.2" fill="#CBD5E1">
    MY EVENT PLANNER
  </text>
</svg>
